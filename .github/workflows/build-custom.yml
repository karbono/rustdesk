name: Build Custom RustDesk (Windows & Android)

on:
  workflow_dispatch:
    inputs:
      only_links:
        description: "Skip the build: only refresh the fixed-name downloads from what the release already has"
        type: boolean
        default: false

permissions: write-all

jobs:
  run-build:
    if: ${{ !inputs.only_links }}
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "custom"

  # The build names its files after the version (rustdesk-1.5.3-x86_64.exe), so a short link
  # would break on every version bump. This copies the newest ones to names that never change:
  #   https://github.com/<repo>/releases/download/custom/rustdesk-lulospi-windows.exe
  #   https://github.com/<repo>/releases/download/custom/rustdesk-lulospi-windows.msi
  #   https://github.com/<repo>/releases/download/custom/rustdesk-lulospi-android.apk
  #   https://github.com/<repo>/releases/download/custom/rustdesk-lulospi-linux.AppImage  (and .deb, .rpm, -suse.rpm)
  # dl.lulospi.party/win and /android redirect to those.
  fixed-name-downloads:
    name: Publish fixed-name downloads
    needs: [run-build]
    if: ${{ always() && (needs.run-build.result == 'success' || needs.run-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: custom
    steps:
      - name: Copy the newest build to the fixed names
        shell: bash
        run: |
          set -euo pipefail
          mkdir dl && cd dl
          gh release download "$TAG" --pattern 'rustdesk-[0-9]*-x86_64.exe' --pattern 'rustdesk-[0-9]*-x86_64.msi' \
            --pattern 'rustdesk-[0-9]*-universal.apk' --pattern 'rustdesk-[0-9]*-universal-signed.apk' \
            --pattern 'rustdesk-[0-9]*-x86_64.AppImage' --pattern 'rustdesk-[0-9]*-x86_64.deb' --pattern 'rustdesk-[0-9]*-x86_64.pkg.tar.zst' \
            --pattern 'rustdesk-[0-9]*.x86_64.rpm' --pattern 'rustdesk-[0-9]*.x86_64-suse.rpm'
          # Highest version wins; for the same version a signed file (…-signed.apk) wins over an unsigned one.
          # With the signing secrets the APK is published as …-universal-signed.apk; without them it is
          # …-universal.apk, signed with a throwaway debug key.
          newest() {
            for f in "$@"; do
              [ -e "$f" ] || continue
              v=${f#rustdesk-}; v=${v%%-*}
              case "$f" in *-signed.*) s=1 ;; *) s=0 ;; esac
              echo "$v $s $f"
            done | sort -k1,1V -k2,2n | tail -1 | cut -d' ' -f3
          }
          exe=$(newest rustdesk-[0-9]*-x86_64.exe); msi=$(newest rustdesk-[0-9]*-x86_64.msi)
          apk=$(newest rustdesk-[0-9]*-universal.apk rustdesk-[0-9]*-universal-signed.apk)
          appimage=$(newest rustdesk-[0-9]*-x86_64.AppImage); deb=$(newest rustdesk-[0-9]*-x86_64.deb)
          arch=$(newest rustdesk-[0-9]*-x86_64.pkg.tar.zst)
          rpm=$(newest rustdesk-[0-9]*.x86_64.rpm); rpmsuse=$(newest rustdesk-[0-9]*.x86_64-suse.rpm)
          # A client that still points at the public servers, or lost the locked settings, must never
          # reach the short links. hide-server-settings only ends up in the Rust library through
          # patch_custom_server.py, so it marks that the settings lock was baked in.
          check_lib() {
            if ! grep -aq 'rd.lulospi.party' "$1" || grep -aq 'rs-ny.rustdesk.com' "$1" || ! grep -aq 'hide-server-settings' "$1"; then
              echo "::error::$2 was not built with the homelab server and locked settings"; exit 1
            fi
          }
          for f in "$exe" "$msi" "$apk"; do
            if [ -z "$f" ] || [ ! -s "$f" ]; then echo "::error::a build is missing from release $TAG (exe='$exe' msi='$msi' apk='$apk')"; exit 1; fi
          done
          # (The Windows exe is a compressed self-extractor: its library is checked inside the build job.)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -p "$apk" "lib/$abi/librustdesk.so" > lib.so
            check_lib lib.so "$apk ($abi)"
          done
          rm -f lib.so
          cp "$exe" rustdesk-lulospi-windows.exe
          cp "$msi" rustdesk-lulospi-windows.msi
          cp "$apk" rustdesk-lulospi-android.apk
          # Linux is optional: the release may predate the Linux build.
          if [ -n "$appimage" ] && [ -s "$appimage" ]; then cp "$appimage" rustdesk-lulospi-linux.AppImage; fi
          if [ -n "$deb" ] && [ -s "$deb" ]; then
            # The AppImage is built from this deb, so checking the deb covers both.
            dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/share/rustdesk/lib/librustdesk.so > lib.so
            check_lib lib.so "$deb"
            rm -f lib.so
            cp "$deb" rustdesk-lulospi-linux.deb
          fi
          if [ -n "$arch" ] && [ -s "$arch" ]; then cp "$arch" rustdesk-lulospi-linux.pkg.tar.zst; fi
          # Same bundle as the deb, packed by rpmbuild; checking one is cheap (bsdtar reads rpm).
          if { [ -n "$rpm" ] || [ -n "$rpmsuse" ]; } && ! command -v bsdtar >/dev/null; then
            sudo apt-get install -y -qq libarchive-tools >/dev/null
          fi
          for f in "$rpm" "$rpmsuse"; do
            [ -n "$f" ] && [ -s "$f" ] || continue
            bsdtar -xOf "$f" ./usr/share/rustdesk/lib/librustdesk.so > lib.so
            check_lib lib.so "$f"
            rm -f lib.so
          done
          if [ -n "$rpm" ] && [ -s "$rpm" ]; then cp "$rpm" rustdesk-lulospi-linux.rpm; fi
          if [ -n "$rpmsuse" ] && [ -s "$rpmsuse" ]; then cp "$rpmsuse" rustdesk-lulospi-linux-suse.rpm; fi
          sha256sum rustdesk-lulospi-* > rustdesk-lulospi-SHA256SUMS.txt
          printf '%s\n' "$exe" "$msi" "$apk" $appimage $deb $arch $rpm $rpmsuse > rustdesk-lulospi-VERSION.txt
          gh release upload "$TAG" rustdesk-lulospi-* --clobber
          cat rustdesk-lulospi-VERSION.txt rustdesk-lulospi-SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
